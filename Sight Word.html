<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Sight Words</title>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body { min-height: 100vh; background: linear-gradient(135deg, #f3e0ff 0%, #e2c6ff 40%, #f9d6ff 100%); font-family: 'Arial', '微软雅黑', sans-serif; display: flex; justify-content: center; align-items: center; padding: 30px 20px; position: relative; }
        .deco-flower { position: absolute; font-size: 70px; opacity: 0.25; pointer-events: none; z-index: 0; }
        .deco-1 { top: 20px; left: 20px; transform: rotate(-10deg); }
        .deco-2 { bottom: 20px; right: 25px; transform: rotate(15deg); }
        .deco-3 { top: 40%; right: 10px; font-size: 55px; opacity: 0.2; }
        .deco-4 { bottom: 15%; left: 15px; font-size: 60px; opacity: 0.2; }
        .glass-card { background: rgba(255, 245, 255, 0.55); backdrop-filter: blur(12px); border-radius: 70px; padding: 30px 40px 50px; box-shadow: 0 25px 45px rgba(128, 0, 128, 0.2), inset 0 1px 2px rgba(255,255,255,0.6); border: 1px solid rgba(255, 220, 255, 0.7); width: 100%; max-width: 1100px; transition: all 0.2s; z-index: 2; }
        .title { text-align: center; font-family: 'Arial', '微软雅黑', sans-serif; font-size: 48px; font-weight: bold; background: linear-gradient(125deg, #a3449e, #cf7fdb); background-clip: text; -webkit-background-clip: text; color: transparent; margin-bottom: 35px; letter-spacing: 2px; text-shadow: 2px 2px 12px rgba(255,215,255,0.8); position: relative; }
        .title::before { content: "🌸"; font-size: 52px; position: absolute; left: 10%; top: -8px; opacity: 0.6; background: none; color: #ffb7e6; text-shadow: none; }
        .title::after { content: "💖"; font-size: 52px; position: absolute; right: 10%; top: -8px; opacity: 0.6; background: none; color: #ffb7e6; }
        .button-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 45px; flex-wrap: wrap; gap: 18px; }
        .btn-group-left { display: flex; gap: 18px; }
        .btn-group-right { display: flex; gap: 18px; }
        .cute-btn { font-family: 'Arial', '微软雅黑', sans-serif; font-size: 30px; font-weight: bold; background: rgba(255, 248, 255, 0.85); backdrop-filter: blur(4px); border: 2px solid #e3a9ff; border-radius: 60px; padding: 8px 28px; color: #8a3b8c; cursor: pointer; transition: 0.15s; box-shadow: 0 5px 0 #bc7ac2; letter-spacing: 1px; }
        .cute-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #bc7ac2; }
        .cute-btn.active-mode { background: #d48bd9; color: white; border-color: #ffefb0; box-shadow: 0 5px 0 #743c7a; text-shadow: 0 1px 1px #5e2a64; }
        .word-navigation { display: flex; align-items: center; justify-content: center; gap: 25px; flex-wrap: wrap; }
        .triangle-btn { width: 75px; height: 75px; background: rgba(255, 215, 250, 0.9); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.15s; box-shadow: 0 8px 0 #b169b0; border: none; font-size: 52px; font-weight: bold; color: #772e7a; backdrop-filter: blur(4px); }
        .triangle-btn:active { transform: translateY(3px); box-shadow: 0 4px 0 #b169b0; }
        .triangle-btn.disabled-btn { opacity: 0; visibility: hidden; pointer-events: none; transform: none; }
        .word-card { background: white; border-radius: 70px; min-width: 500px; max-width: 800px; width: auto; padding: 35px 45px; text-align: center; box-shadow: 0 25px 35px rgba(112, 45, 112, 0.25); border: 3px solid #ffc2f0; cursor: pointer; transition: 0.1s linear; flex: 1; overflow-x: auto; white-space: nowrap; scrollbar-width: thin; }
        .word-card::-webkit-scrollbar { height: 6px; background: #f1d6ff; border-radius: 10px; }
        .word-card::-webkit-scrollbar-thumb { background: #cb86d4; border-radius: 10px; }
        .word-text { font-family: 'Arial', '微软雅黑', 'Microsoft YaHei', sans-serif; font-size: 80px; font-weight: bold; line-height: 1.2; display: inline-block; white-space: nowrap; }
        .phonic-colored { font-family: 'Arial', '微软雅黑', sans-serif; font-size: inherit; font-weight: bold; white-space: nowrap; display: inline-block; }
        .phonic-colored span { display: inline-block; font-size: inherit; font-weight: bold; }
        .word-counter { text-align: center; margin-top: 20px; font-size: 22px; font-weight: bold; color: #b45fbf; background: rgba(255,235,255,0.7); display: inline-block; width: auto; padding: 5px 20px; border-radius: 60px; backdrop-filter: blur(4px); }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(90, 35, 100, 0.7); backdrop-filter: blur(8px); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: #fff7ff; border-radius: 70px; width: 90%; max-width: 580px; padding: 35px 30px; text-align: center; border: 4px solid #f0b5ff; box-shadow: 0 20px 35px #4f2b54; }
        .modal-content h3 { font-size: 38px; color: #bc6fcf; margin-bottom: 20px; font-family: 'Arial', '微软雅黑'; }
        .file-label { background: #e7c2ff; padding: 18px 20px; border-radius: 60px; font-size: 28px; font-weight: bold; color: #601f66; cursor: pointer; display: inline-block; margin: 15px 0; transition: 0.1s; }
        .file-label:active { background: #cf98e6; }
        .modal-buttons { margin-top: 25px; display: flex; gap: 20px; justify-content: center; }
        .modal-buttons button { font-size: 28px; padding: 8px 30px; background: #e2b1ff; border: none; border-radius: 50px; color: #3b1340; font-weight: bold; cursor: pointer; }
        .info-text { font-size: 18px; margin-top: 10px; color: #a15caa; }
        .finish-toast { position: fixed; top: 45%; left: 50%; transform: translate(-50%, -50%); background: radial-gradient(circle, #ffecb3, #ffc7f0); color: #c24bd6; font-size: 70px; font-weight: bold; padding: 30px 70px; border-radius: 100px; box-shadow: 0 0 45px #ffa3f0; z-index: 1200; white-space: nowrap; border: 5px solid gold; font-family: 'Arial', '微软雅黑'; text-align: center; animation: fadeScale 0.4s ease forwards; pointer-events: none; }
        @keyframes fadeScale { 0% { opacity: 0; transform: translate(-50%, -50%) scale(0.6);} 20% { opacity: 1; transform: translate(-50%, -50%) scale(1.1);} 80% { opacity: 1; transform: translate(-50%, -50%) scale(1);} 100% { opacity: 0; transform: translate(-50%, -50%) scale(0.9); visibility: hidden;} }
        @media (max-width: 780px) {
            .glass-card { padding: 25px 20px; }
            .word-card { min-width: 260px; padding: 20px 25px; }
            .word-text { font-size: 48px; }
            .cute-btn { font-size: 22px; padding: 5px 18px; }
            .triangle-btn { width: 58px; height: 58px; font-size: 40px; }
            .title { font-size: 38px; }
        }
    </style>
</head>
<body>

<div class="deco-flower deco-1">🎀🌸</div>
<div class="deco-flower deco-2">💖🌸</div>
<div class="deco-flower deco-3">🌼💗</div>
<div class="deco-flower deco-4">🎀✨</div>

<div class="glass-card">
    <div class="title">Sight Words</div>
    <div class="button-bar">
        <div class="btn-group-left"><button class="cute-btn" id="inputBtn">📂 Input</button></div>
        <div class="btn-group-right">
            <button class="cute-btn" id="phonicBtn">🔊 Phonic</button>
            <button class="cute-btn" id="randomBtn">🎲 Random</button>
            <button class="cute-btn" id="testBtn">✏️ Test</button>
        </div>
    </div>
    <div class="word-navigation">
        <div class="triangle-btn" id="leftTriangleBtn">◀</div>
        <div class="word-card" id="wordCard"><div id="wordDisplay" class="word-text">✨ 單詞 ✨</div></div>
        <div class="triangle-btn" id="rightTriangleBtn">▶</div>
    </div>
    <div style="text-align: center; margin-top: 20px;"><div class="word-counter" id="counterDisplay"></div></div>
</div>

<div id="excelModal" class="modal">
    <div class="modal-content">
        <h3>📎 上傳 Excel 表格</h3>
        <p style="font-size: 20px; color:#a347b3;">格式: 欄位包含 <strong>word, audio, phonic</strong></p>
        <label class="file-label" id="fileSelectLabel">📂 選擇 .xlsx / .xls 文件</label>
        <input type="file" id="excelUpload" accept=".xlsx, .xls, .csv" style="display: none;">
        <div class="info-text">💡 若無上傳，將保留原有單詞庫</div>
        <div class="modal-buttons"><button id="closeModalBtn">關閉</button></div>
    </div>
</div>

<script>
    let wordsLibrary = [];
    let currentOrderIndices = [];
    let currentIdx = 0;
    let isRandomMode = false;
    let isPhonicMode = false;
    let isTestMode = false;

    const wordDisplayDiv = document.getElementById('wordDisplay');
    const leftBtn = document.getElementById('leftTriangleBtn');
    const rightBtn = document.getElementById('rightTriangleBtn');
    const inputBtn = document.getElementById('inputBtn');
    const phonicBtn = document.getElementById('phonicBtn');
    const randomBtn = document.getElementById('randomBtn');
    const testBtn = document.getElementById('testBtn');
    const wordCardArea = document.getElementById('wordCard');
    const counterSpan = document.getElementById('counterDisplay');
    const modal = document.getElementById('excelModal');
    const fileInput = document.getElementById('excelUpload');
    const closeModalBtn = document.getElementById('closeModalBtn');
    const fileSelectLabel = document.getElementById('fileSelectLabel');

    // ============================================================
    // 發音核心：iOS Safari 兼容版
    // ============================================================

    const HAS_CHINESE = /[\u4E00-\u9FA5]|[\uFE30-\uFFA0]/;
    let voicesLoaded = false;
    let cachedVoices = [];
    let speechUnlocked = false;

    function initVoices() {
        if (!('speechSynthesis' in window)) return;
        const load = () => {
            const v = speechSynthesis.getVoices();
            if (v && v.length > 0) {
                cachedVoices = v;
                voicesLoaded = true;
            }
        };
        load();
        speechSynthesis.onvoiceschanged = load;
        let tries = 0;
        const timer = setInterval(() => {
            tries++;
            load();
            if (voicesLoaded || tries >= 10) clearInterval(timer);
        }, 500);
    }

    function unlockSpeech() {
        if (speechUnlocked) return;
        if (!('speechSynthesis' in window)) return;
        try {
            speechSynthesis.cancel();
            const dummy = new SpeechSynthesisUtterance('');
            dummy.volume = 0;
            speechSynthesis.speak(dummy);
            speechUnlocked = true;
            setTimeout(initVoices, 100);
        } catch (e) { /* 靜默 */ }
    }

    function pickVoice(lang) {
        if (!voicesLoaded) cachedVoices = speechSynthesis.getVoices();
        const voices = cachedVoices;
        if (!voices || voices.length === 0) return null;
        let found = voices.find(v => v.lang === lang && v.localService);
        if (!found) found = voices.find(v => v.lang === lang);
        if (!found) {
            const prefix = lang.split('-')[0];
            found = voices.find(v => v.lang.startsWith(prefix) && v.localService);
            if (!found) found = voices.find(v => v.lang.startsWith(prefix));
        }
        if (!found) {
            const kw = lang.startsWith('zh') ? /Chinese|中文|國語|普通话|Tingting|Meijia/i
                                              : /English|英文|Samantha|Alex|Daniel|Karen/i;
            found = voices.find(v => kw.test(v.name));
        }
        return found || null;
    }

    function speakWithWebSpeech(text) {
        if (!('speechSynthesis' in window) || !text) return;
        const isChinese = HAS_CHINESE.test(text);
        const lang = isChinese ? 'zh-CN' : 'en-US';
        const voice = pickVoice(lang);
        if (!voice && !isChinese) {
            console.warn(`未找到 ${lang} 語音，請確認裝置已下載英文語音包`);
        }
        speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = lang;
        utterance.rate = isChinese ? 0.9 : 0.85;
        utterance.pitch = isChinese ? 0.8 : 1;
        utterance.volume = 1;
        if (voice) utterance.voice = voice;
        speechSynthesis.speak(utterance);
    }

    function getCurrentItem() {
        if (!wordsLibrary.length || currentOrderIndices.length === 0) return null;
        return wordsLibrary[currentOrderIndices[currentIdx]] || null;
    }

    function speakText(text) {
        if (!text || !text.trim()) return;
        const item = getCurrentItem();
        const audioUrl = item && item.audio && item.audio.trim() !== '' ? item.audio.trim() : null;

        if (HAS_CHINESE.test(text)) {
            speakWithWebSpeech(text);
            return;
        }

        if (audioUrl) {
            try {
                const audio = new Audio(audioUrl);
                audio.play().catch(() => {
                    if (speechUnlocked) speakWithWebSpeech(text);
                });
                return;
            } catch (e) { /* 繼續走 Web Speech */ }
        }
        speakWithWebSpeech(text);
    }

    // ============================================================
    // 字型自動縮放
    // ============================================================

    function fitWordDisplay() {
        if (!wordsLibrary.length || currentOrderIndices.length === 0) {
            wordDisplayDiv.style.fontSize = '';
            return;
        }
        const container = wordCardArea;
        const cs = getComputedStyle(container);
        const padL = parseFloat(cs.paddingLeft) || 0;
        const padR = parseFloat(cs.paddingRight) || 0;
        const available = container.clientWidth - padL - padR;
        if (available <= 0) return;

        const base = window.innerWidth <= 780 ? 48 : 80;
        let size = base;
        wordDisplayDiv.style.fontSize = size + 'px';

        let guard = 0;
        while (wordDisplayDiv.scrollWidth > available && size > 16 && guard < 200) {
            size -= 1;
            wordDisplayDiv.style.fontSize = size + 'px';
            guard++;
        }
    }

    // ============================================================
    // 原有邏輯
    // ============================================================

    function rebuildOrderIndices() {
        if (!wordsLibrary.length) { currentOrderIndices = []; return; }
        const total = wordsLibrary.length;
        if (isRandomMode) {
            let arr = Array.from({length: total}, (_, i) => i);
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            currentOrderIndices = arr;
        } else {
            currentOrderIndices = Array.from({length: total}, (_, i) => i);
        }
    }

    function updateTriangleVisibility() {
        if (!wordsLibrary.length || currentOrderIndices.length === 0) {
            leftBtn.classList.add('disabled-btn');
            rightBtn.classList.add('disabled-btn');
            return;
        }
        leftBtn.classList.toggle('disabled-btn', currentIdx === 0);
        rightBtn.classList.remove('disabled-btn');
    }

    function updateCounter() {
        counterSpan.innerText = (wordsLibrary.length && currentOrderIndices.length)
            ? `${currentIdx + 1} / ${currentOrderIndices.length}` : `0 / 0`;
    }

    function colorizePhonic(phonicStr) {
        if (!phonicStr) return '<span style="color:#888;">(無音標)</span>';
        let result = '';
        for (let ch of phonicStr) {
            const lower = ch.toLowerCase();
            if (ch === ' ') {
                // ★ 空格用 &nbsp; 保留寬度，避免 inline-block 修剪空白
                result += `<span style="color:#5f5b6e;">&nbsp;</span>`;
            } else if ('aeiou'.includes(lower)) {
                result += `<span style="color:#e34234; font-weight:bold;">${escapeHtml(ch)}</span>`;
            } else if (ch === '-') {
                result += `<span style="color:#b0b0b0;">-</span>`;
            } else if (/[a-zA-Z]/.test(ch)) {
                result += `<span style="color:#3a6ea5; font-weight:bold;">${escapeHtml(ch)}</span>`;
            } else {
                result += `<span style="color:#5f5b6e;">${escapeHtml(ch)}</span>`;
            }
        }
        return `<div class="phonic-colored">${result}</div>`;
    }

    function escapeHtml(str) {
        return String(str).replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
    }

    function renderCurrentWord() {
        if (!wordsLibrary.length || currentOrderIndices.length === 0) {
            wordDisplayDiv.innerHTML = '🌸 點擊 Input 匯入單詞 🌸';
            wordDisplayDiv.className = 'word-text';
            wordDisplayDiv.style.fontSize = '';
            updateCounter();
            updateTriangleVisibility();
            return;
        }
        const item = getCurrentItem();
        if (!item) return;

        if (isPhonicMode) {
            const phonicRaw = item.phonic || '';
            wordDisplayDiv.innerHTML = phonicRaw.trim() === ''
                ? `<div class="phonic-colored">🔊 無音標</div>`
                : colorizePhonic(phonicRaw);
        } else {
            wordDisplayDiv.innerHTML = escapeHtml(item.word || '???');
            wordDisplayDiv.className = 'word-text';
        }
        updateCounter();
        updateTriangleVisibility();
        fitWordDisplay();
    }

    function speakCurrentWord() {
        if (isTestMode) return;
        const item = getCurrentItem();
        if (!item || !item.word) return;
        unlockSpeech();
        speakText(item.word);
    }

    let finishLock = false;
    function showFinishAndRestart() {
        if (finishLock) return;
        finishLock = true;
        const toast = document.createElement('div');
        toast.className = 'finish-toast';
        toast.innerText = '🎉 Finish! 🎉';
        document.body.appendChild(toast);
        setTimeout(() => { if (toast && toast.remove) toast.remove(); }, 700);
        if (currentOrderIndices.length) { currentIdx = 0; renderCurrentWord(); }
        setTimeout(() => { finishLock = false; }, 800);
    }

    function nextWord() {
        if (!wordsLibrary.length || currentOrderIndices.length === 0) return;
        if (currentIdx === currentOrderIndices.length - 1) { showFinishAndRestart(); return; }
        if (currentIdx + 1 < currentOrderIndices.length) { currentIdx++; renderCurrentWord(); }
    }

    function prevWord() {
        if (!wordsLibrary.length || currentOrderIndices.length === 0) return;
        if (currentIdx > 0) { currentIdx--; renderCurrentWord(); }
    }

    function toggleRandomMode() {
        if (!wordsLibrary.length) { alert("還沒有單詞！請先匯入 Excel ～ 💖"); return; }
        isRandomMode = !isRandomMode;
        randomBtn.classList.toggle('active-mode', isRandomMode);
        rebuildOrderIndices(); currentIdx = 0; renderCurrentWord();
    }

    function togglePhonicMode() {
        if (!wordsLibrary.length) { alert("沒有單詞資料，無法使用 Phonic 模式"); return; }
        isPhonicMode = !isPhonicMode;
        phonicBtn.classList.toggle('active-mode', isPhonicMode);
        renderCurrentWord();
    }

    function toggleTestMode() {
        if (!wordsLibrary.length) { alert("沒有單詞，請先匯入資料"); return; }
        isTestMode = !isTestMode;
        testBtn.classList.toggle('active-mode', isTestMode);
    }

    function saveToLocalStorage() {
        localStorage.setItem('sightWordsLibrary', JSON.stringify(wordsLibrary));
        localStorage.setItem('sightWordsMeta', JSON.stringify({ version: 1 }));
    }

    function loadFromLocalStorage() {
        const stored = localStorage.getItem('sightWordsLibrary');
        if (stored) {
            try {
                wordsLibrary = JSON.parse(stored);
                if (!Array.isArray(wordsLibrary)) wordsLibrary = [];
            } catch(e) { wordsLibrary = []; }
        } else {
            // ★ 不再預設單詞，沒有資料就是空陣列
            wordsLibrary = [];
        }
        isRandomMode = false; isPhonicMode = false; isTestMode = false;
        randomBtn.classList.remove('active-mode');
        phonicBtn.classList.remove('active-mode');
        testBtn.classList.remove('active-mode');
        rebuildOrderIndices();
        currentIdx = 0;
        renderCurrentWord();
        initVoices();
    }

    function importExcelData(file) {
        const reader = new FileReader();
        reader.onload = function(e) {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, { type: 'array' });
            const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
            const rows = XLSX.utils.sheet_to_json(firstSheet, { header: 1, defval: "" });
            if (!rows || rows.length < 2) { alert("Excel 至少包含標題行和一行數據"); return; }
            const headers = rows[0].map(cell => String(cell || "").trim().toLowerCase());
            const wordIdx = headers.findIndex(h => h.includes('word'));
            const audioIdx = headers.findIndex(h => h.includes('audio'));
            const phonicIdx = headers.findIndex(h => h.includes('phonic'));
            if (wordIdx === -1) { alert("Excel 需包含 'word' 列 (單詞)"); return; }
            const newLibrary = [];
            for (let i = 1; i < rows.length; i++) {
                const row = rows[i];
                if (!row || row.length === 0) continue;
                let word = row[wordIdx] ? String(row[wordIdx]).trim() : "";
                if (word === "") continue;
                newLibrary.push({
                    word,
                    audio: (audioIdx !== -1 && row[audioIdx]) ? String(row[audioIdx]).trim() : "",
                    phonic: (phonicIdx !== -1 && row[phonicIdx]) ? String(row[phonicIdx]).trim() : ""
                });
            }
            if (newLibrary.length === 0) { alert("沒有有效的單詞數據"); return; }
            wordsLibrary = newLibrary;
            isRandomMode = false; isPhonicMode = false; isTestMode = false;
            randomBtn.classList.remove('active-mode');
            phonicBtn.classList.remove('active-mode');
            testBtn.classList.remove('active-mode');
            rebuildOrderIndices();
            currentIdx = 0;
            renderCurrentWord();
            saveToLocalStorage();
            alert(`成功匯入 ${wordsLibrary.length} 個單詞！✨`);
            closeModal();
        };
        reader.onerror = () => alert("讀取檔案失敗");
        reader.readAsArrayBuffer(file);
    }

    function openModal() { modal.style.display = 'flex'; }
    function closeModal() { modal.style.display = 'none'; }

    fileSelectLabel.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', (e) => {
        if (fileInput.files && fileInput.files[0]) importExcelData(fileInput.files[0]);
        fileInput.value = '';
    });
    inputBtn.addEventListener('click', openModal);
    closeModalBtn.addEventListener('click', closeModal);
    modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });

    leftBtn.addEventListener('click', prevWord);
    rightBtn.addEventListener('click', nextWord);
    phonicBtn.addEventListener('click', togglePhonicMode);
    randomBtn.addEventListener('click', toggleRandomMode);
    testBtn.addEventListener('click', toggleTestMode);
    wordCardArea.addEventListener('click', (e) => {
        e.stopPropagation();
        speakCurrentWord();
    });

    // 視窗大小變化時重新計算字型
    window.addEventListener('resize', () => {
        if (wordsLibrary.length) fitWordDisplay();
    });

    loadFromLocalStorage();
</script>
</body>
</html>
