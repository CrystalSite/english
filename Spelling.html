<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spelling</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #ffebf3;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-family: Arial, sans-serif;
            font-size: 30px;
            font-weight: bold;
            color: #ff6b9d;
            text-align: center;
            margin-bottom: 20px;
        }

        .button-container {
            width: 100%;
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .button {
            font-family: Arial, sans-serif;
            font-size: 28px;
            padding: 10px 20px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
        }

        #report-btn { background-color: #ffb6d9; color: white; }
        #input-btn { background-color: #d9b6ff; color: white; }
        #hint-btn { background-color: #a8e6ff; color: white; }

        .word-card {
            background-color: white;
            border-radius: 20px;
            padding: 20px;
            width: 100%;
            margin-bottom: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            text-align: center;
            position: relative;
        }

        .play-button {
            font-size: 38px;
            color: #ff6b9d;
            background: none;
            border: none;
            cursor: pointer;
            margin: 0 auto 20px;
            padding: 0;
            display: none;
        }

        .play-button:hover { transform: scale(1.1); }

        .pulse { animation: pulse 1s infinite; }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .meaning {
            font-family: "Microsoft YaHei", sans-serif;
            font-size: 34px;
            margin-bottom: 10px;
            color: #333;
        }

        .pos {
            font-family: "Times New Roman", serif;
            font-size: 28px;
            margin-bottom: 10px;
            color: #666;
            font-style: italic;
        }

        .phonics {
            font-family: Arial, sans-serif;
            font-size: 38px;
            font-weight: bold;
            color: white;
            margin-bottom: 10px;
            visibility: hidden;
            height: 45px;
        }

        .phonics.show { visibility: visible; }
        .phonics.show .vowel { color: #ff6b9d; }
        .phonics.show .consonant { color: #4da6ff; }
        .phonics.show .hyphen { color: #4CAF50; }

        .spelling-area {
            width: 100%;
            margin: 20px 0;
            position: relative;
            display: none;
            flex-direction: column;
            align-items: center;
        }

        .letter-line {
            height: 2px;
            background-color: #ff9ec6;
            margin: 0 auto;
            width: 100%;
            position: relative;
        }

        /* 已選字母區：設置 flex 與 按詞分組 */
        .selected-letters {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 15px; /* 詞與詞、詞與空格之間的間距 */
            margin-bottom: 10px;
            min-height: 60px;
            align-items: flex-end;
            width: 100%;
        }

        /* 每個單字的分組，保證單字不會被切斷換行 */
        .word-group {
            display: flex;
            gap: 8px; /* 單字內字母的間距 */
        }

        .letter-container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 20px;
            width: 100%;
        }

        .letter {
            font-family: Arial, sans-serif;
            font-size: 36px;
            font-weight: bold;
            width: 50px;
            height: 50px;
            background-color: white;
            border: 2px solid #a8e6ff;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 3px 6px rgba(0,0,0,0.1);
            transition: all 0.3s;
            color: #5a5a5a;
        }

        .letter:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 10px rgba(0,0,0,0.2);
            background-color: #f0f9ff;
        }

        .selected-letter {
            font-family: Arial, sans-serif;
            font-size: 36px;
            font-weight: bold;
            width: 50px;
            height: 50px;
            background-color: white;
            border: 2px solid #ffb6d9;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 3px 6px rgba(0,0,0,0.1);
            color: #5a5a5a;
        }

        .feedback {
            font-size: 50px;
            margin: 20px 0;
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .flash { animation: flash 0.5s; }

        @keyframes flash {
            0% { opacity: 1; }
            50% { opacity: 0.3; }
            100% { opacity: 1; }
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.5);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background-color: white;
            padding: 30px;
            border-radius: 20px;
            width: 80%;
            max-width: 600px;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .modal-title {
            font-family: Arial, sans-serif;
            font-size: 32px;
            font-weight: bold;
            color: #ff6b9d;
            margin-bottom: 20px;
            text-align: center;
        }

        .modal-item { margin-bottom: 15px; font-size: 20px; }

        .close-btn {
            background-color: #ff6b9d;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 20px;
            font-size: 18px;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }

        .progress-container {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.5);
            z-index: 200;
            justify-content: center;
            align-items: center;
        }

        .progress-content {
            background-color: white;
            padding: 30px;
            border-radius: 20px;
            width: 80%;
            max-width: 500px;
            text-align: center;
        }

        .progress-bar {
            width: 100%; height: 20px;
            background-color: #f0f0f0;
            border-radius: 10px;
            margin: 20px 0;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background-color: #ff6b9d;
            width: 0%;
            transition: width 0.3s;
        }

        #file-input { display: none; }

        .empty-message {
            color: #888;
            font-size: 24px;
            margin: 50px 0;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Spelling</h1>
        
        <div class="button-container">
            <div>
                <button id="report-btn" class="button">Report</button>
                <button id="input-btn" class="button">Input</button>
            </div>
            <button id="hint-btn" class="button">Hint</button>
        </div>
        
        <div id="empty-message" class="empty-message">請點擊 Input 導入 Excel/CSV 單字表以開始遊戲。</div>

        <div class="word-card" id="word-card" style="display: none;">
            <button class="play-button" id="play-btn">▶︎</button>
            <div class="meaning" id="meaning"></div>
            <div class="pos" id="pos"></div>
            <div class="phonics" id="phonics"></div>
        </div>
        
        <div class="spelling-area" id="spelling-area">
            <div class="selected-letters" id="selected-letters"></div>
            <div class="letter-line" id="letter-line"></div>
            <div class="letter-container" id="letter-container"></div>
        </div>
        
        <div class="feedback" id="feedback"></div>
    </div>
    
    <div class="modal" id="report-modal">
        <div class="modal-content">
            <div class="modal-title">Result</div>
            <div class="modal-item" id="date"></div>
            <div class="modal-item">Words completed: <span id="completed-words">0</span>/<span id="total-words-count">0</span></div>
            <div class="modal-item">Words to review: <span id="review-words"></span></div>
            <button class="close-btn" id="close-btn">Close</button>
        </div>
    </div>

    <div class="progress-container" id="progress-container">
        <div class="progress-content">
            <div class="modal-title">Importing Words</div>
            <div id="progress-text">0%</div>
            <div class="progress-bar">
                <div class="progress-fill" id="progress-fill"></div>
            </div>
        </div>
    </div>

    <input type="file" id="file-input" accept=".xlsx,.xls,.csv">
    <label for="file-input" id="file-label" class="file-label" style="display:none;">Choose Excel File</label>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script>
        let wordPool = [];

        // Game state
        let words = [];
        let remainingWords = [];
        let currentWordIndex = 0;
        let selectedLetters = [];
        let wordsToReview = [];
        let completedWordsCount = 0;
        let currentWord = null;
        
        // 音效與發音相關
        let audio = new Audio();
        let correctAudio = new Audio("https://dict.youdao.com/dictvoice?type=0&audio=great");
        let wrongAudio = new Audio("https://dict.youdao.com/dictvoice?type=0&audio=oh%20no");

        // 語音合成 API
        const synth = window.speechSynthesis;
        let englishVoice = null;

        // 異步加載語音列表，優先選取女聲
        function loadVoices() {
            const voices = synth.getVoices();
            if (voices.length > 0) {
                const femaleKeywords = ['samantha', 'victoria', 'karen', 'moira', 'tessa', 'zira', 'google us english'];
                
                let preferredVoice = voices.find(v => 
                    v.lang.startsWith('en') && 
                    femaleKeywords.some(keyword => v.name.toLowerCase().includes(keyword))
                );

                if (!preferredVoice) {
                    preferredVoice = voices.find(v => 
                        v.lang.startsWith('en') && 
                        v.name.toLowerCase().includes('female')
                    );
                }

                if (!preferredVoice) {
                    preferredVoice = voices.find(v => v.lang === 'en-US' || v.lang === 'en-GB') 
                                 || voices.find(v => v.lang.startsWith('en'));
                }
                
                englishVoice = preferredVoice;
                console.log("已選擇的語音包:", englishVoice ? englishVoice.name : "預設");
            }
        }
        
        if (typeof speechSynthesis !== 'undefined' && speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = loadVoices;
        }
        loadVoices();

        // 手勢解鎖
        function unlockSpeech() {
            if (synth) {
                synth.cancel();
                const utterance = new SpeechSynthesisUtterance('');
                utterance.volume = 0;
                synth.speak(utterance);
            }
        }

        // 備用發音：Web Speech API
        function speakWordFallback(text) {
            if (!synth || !text) return;
            
            synth.cancel();
            
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = 0.85;
            if (englishVoice) utterance.voice = englishVoice;

            utterance.onstart = () => playBtn.classList.add('pulse');
            utterance.onend = () => playBtn.classList.remove('pulse');
            utterance.onerror = (e) => {
                playBtn.classList.remove('pulse');
                console.warn("Web Speech API 錯誤:", e.error);
            };
            
            synth.speak(utterance);
        }

        // 核心發音邏輯：優先有道，失敗則 Web Speech API
        function playPronounciation(text) {
            if (!text) return;
            
            synth.cancel();
            audio.pause();
            
            let hasFallenBack = false;
            const triggerFallback = () => {
                if (hasFallenBack) return;
                hasFallenBack = true;
                playBtn.classList.remove('pulse');
                speakWordFallback(text);
            };

            const url = `https://dict.youdao.com/dictvoice?type=0&audio=${encodeURIComponent(text)}`;
            audio.src = url;
            playBtn.classList.add('pulse');
            
            audio.onerror = triggerFallback;

            const playPromise = audio.play();
            if (playPromise !== undefined) {
                playPromise.catch(() => {
                    triggerFallback();
                });
            }
            
            audio.onended = () => {
                playBtn.classList.remove('pulse');
            };
        }

        // DOM elements
        const playBtn = document.getElementById('play-btn');
        const wordCard = document.getElementById('word-card');
        const spellingArea = document.getElementById('spelling-area');
        const emptyMessage = document.getElementById('empty-message');
        
        const meaningEl = document.getElementById('meaning');
        const posEl = document.getElementById('pos');
        const phonicsEl = document.getElementById('phonics');
        const selectedLettersEl = document.getElementById('selected-letters');
        const letterContainer = document.getElementById('letter-container');
        const feedbackEl = document.getElementById('feedback');
        const reportBtn = document.getElementById('report-btn');
        const inputBtn = document.getElementById('input-btn');
        const hintBtn = document.getElementById('hint-btn');
        const reportModal = document.getElementById('report-modal');
        const dateEl = document.getElementById('date');
        const completedWordsEl = document.getElementById('completed-words');
        const totalWordsCountEl = document.getElementById('total-words-count');
        const reviewWordsEl = document.getElementById('review-words');
        const closeBtn = document.getElementById('close-btn');
        const progressContainer = document.getElementById('progress-container');
        const progressFill = document.getElementById('progress-fill');
        const progressText = document.getElementById('progress-text');
        const fileInput = document.getElementById('file-input');

        function loadSavedWords() {
            const savedWords = localStorage.getItem('wordPool');
            if (savedWords) wordPool = JSON.parse(savedWords);
            const savedReview = localStorage.getItem('wordsToReview');
            if (savedReview) wordsToReview = JSON.parse(savedReview);
        }

        function saveWords() {
            localStorage.setItem('wordPool', JSON.stringify(wordPool));
            localStorage.setItem('wordsToReview', JSON.stringify(wordsToReview));
        }

        function initGame() {
            loadSavedWords();
            completedWordsCount = 0;
            words = [...wordPool];
            remainingWords = [...wordPool];
            shuffleArray(remainingWords);
            
            totalWordsCountEl.textContent = wordPool.length;
            
            if (remainingWords.length > 0) {
                showGameUI();
                loadWord();
            } else {
                showEmptyUI();
            }
            
            setupEventListeners();
        }

        function showGameUI() {
            emptyMessage.style.display = 'none';
            wordCard.style.display = 'block';
            spellingArea.style.display = 'flex';
            playBtn.style.display = 'block';
        }

        function showEmptyUI() {
            emptyMessage.style.display = 'block';
            wordCard.style.display = 'none';
            spellingArea.style.display = 'none';
        }

        function loadWord() {
            currentWord = remainingWords[currentWordIndex];
            meaningEl.textContent = currentWord.meaning;
            posEl.textContent = currentWord.pos;
            
            const phonicsParts = currentWord.phonic.split('-');
            phonicsEl.innerHTML = phonicsParts.map(part => {
                return part.split('').map(char => {
                    if (/[aeiouy]/i.test(char)) return `<span class="vowel">${char}</span>`;
                    else if (char === '-') return `<span class="hyphen">${char}</span>`;
                    else return `<span class="consonant">${char}</span>`;
                }).join('');
            }).join('<span class="hyphen">-</span>');
            
            phonicsEl.classList.remove('show');
            setupLetterSelection();
            
            setTimeout(() => { playPronounciation(currentWord.word); }, 100);
        }

        function setupLetterSelection() {
            selectedLettersEl.innerHTML = '';
            letterContainer.innerHTML = '';
            selectedLetters = [];
            
            const letters = currentWord.word.split('');
            const extraCount = currentWord.word.length < 10 ? (2 + Math.floor(Math.random() * 2)) : 0;
            const extraLetters = getRandomLetters(extraCount, letters.filter(l => l !== ' '));
            const allLetters = [...letters, ...extraLetters];
            
            shuffleArray(allLetters);
            
            allLetters.forEach((letter, index) => {
                const letterEl = document.createElement('div');
                letterEl.className = 'letter';
                letterEl.textContent = letter === ' ' ? '' : letter;
                letterEl.dataset.index = index;
                letterEl.addEventListener('click', () => {
                    selectLetter(letterEl, letter);
                    phonicsEl.classList.remove('show');
                });
                letterContainer.appendChild(letterEl);
            });
        }

        function getRandomLetters(count, excludeLetters) {
            const alphabet = 'abcdefghijklmnopqrstuvwxyz';
            const excludeSet = new Set(excludeLetters.map(l => l.toLowerCase()));
            const availableLetters = alphabet.split('').filter(l => !excludeSet.has(l));
            shuffleArray(availableLetters);
            return availableLetters.slice(0, count);
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function selectLetter(letterEl, letter) {
            const selectedIndex = selectedLetters.findIndex(l => l.element === letterEl);
            if (selectedIndex !== -1) {
                const removed = selectedLetters.splice(selectedIndex, 1)[0];
                removed.element.style.display = 'flex';
                updateSelectedLetters();
                return;
            }
            
            selectedLetters.push({ letter, element: letterEl });
            letterEl.style.display = 'none';
            updateSelectedLetters();
            
            if (selectedLetters.length === currentWord.word.length) {
                checkWord();
            }
        }

        // 修正：空格在答案區顯示為一個帶邊框的空白格子，並支援點擊退回
        function updateSelectedLetters() {
            selectedLettersEl.innerHTML = '';
            
            let currentWordGroup = document.createElement('div');
            currentWordGroup.className = 'word-group';
            
            selectedLetters.forEach((item) => {
                if (item.letter === ' ') {
                    // 如果當前單字組有字母，先加入容器
                    if (currentWordGroup.children.length > 0) {
                        selectedLettersEl.appendChild(currentWordGroup);
                        currentWordGroup = document.createElement('div');
                        currentWordGroup.className = 'word-group';
                    }
                    
                    // 創建一個具有 selected-letter 樣式的空白格子
                    const spaceEl = document.createElement('div');
                    spaceEl.className = 'selected-letter';
                    spaceEl.textContent = ''; // 不顯示任何符號
                    
                    // 點擊空格格子可退回下方
                    spaceEl.addEventListener('click', () => {
                        item.element.style.display = 'flex';
                        selectedLetters = selectedLetters.filter(l => l !== item);
                        updateSelectedLetters();
                        phonicsEl.classList.remove('show');
                    });
                    selectedLettersEl.appendChild(spaceEl);
                } else {
                    // 普通字母加入當前單字組
                    const letterEl = document.createElement('div');
                    letterEl.className = 'selected-letter';
                    letterEl.textContent = item.letter;
                    letterEl.addEventListener('click', () => {
                        item.element.style.display = 'flex';
                        selectedLetters = selectedLetters.filter(l => l !== item);
                        updateSelectedLetters();
                        phonicsEl.classList.remove('show');
                    });
                    currentWordGroup.appendChild(letterEl);
                }
            });
            
            // 加入最後一個單字組
            if (currentWordGroup.children.length > 0) {
                selectedLettersEl.appendChild(currentWordGroup);
            }
        }

        function checkWord() {
            const userWord = selectedLetters.map(l => l.letter).join('').toLowerCase();
            
            if (userWord === currentWord.word.toLowerCase()) {
                feedbackEl.textContent = '✔';
                feedbackEl.style.color = '#4CAF50';
                correctAudio.play();
                
                remainingWords.splice(currentWordIndex, 1);
                completedWordsCount++;
                
                setTimeout(() => {
                    feedbackEl.textContent = '';
                    if (remainingWords.length > 0) {
                        currentWordIndex = Math.floor(Math.random() * remainingWords.length);
                        loadWord();
                    } else {
                        showReport();
                    }
                }, 1500);
            } else {
                feedbackEl.textContent = '✘';
                feedbackEl.style.color = '#F44336';
                wrongAudio.play();
                
                const selectedEls = selectedLettersEl.querySelectorAll('.selected-letter');
                selectedEls.forEach(el => {
                    el.classList.add('flash');
                    setTimeout(() => el.classList.remove('flash'), 500);
                });
                
                if (!wordsToReview.includes(currentWord.word)) {
                    wordsToReview.push(currentWord.word);
                }
                
                setTimeout(() => {
                    feedbackEl.textContent = '';
                    setupLetterSelection();
                    setTimeout(() => { playPronounciation(currentWord.word); }, 100);
                }, 1500);
            }
            
            saveWords();
        }

        function showReport() {
            const now = new Date();
            dateEl.textContent = now.toLocaleDateString() + ' ' + now.toLocaleTimeString();
            completedWordsEl.textContent = completedWordsCount;
            totalWordsCountEl.textContent = wordPool.length;
            reviewWordsEl.textContent = wordsToReview.join(', ') || 'None';
            reportModal.style.display = 'flex';
        }

        function importWordsFromExcel(file) {
            progressContainer.style.display = 'flex';
            progressFill.style.width = '0%';
            progressText.textContent = '0%';
            
            const reader = new FileReader();
            reader.onload = function(e) {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                const jsonData = XLSX.utils.sheet_to_json(firstSheet);
                
                let newWordPool = [];
                let processed = 0;
                
                const processBatch = (start, batchSize) => {
                    const end = Math.min(start + batchSize, jsonData.length);
                    
                    for (let i = start; i < end; i++) {
                        const row = jsonData[i];
                        if (row.word && row.meaning) {
                            newWordPool.push({
                                word: row.word.toString(),
                                phonic: row.phonic ? row.phonic.toString() : row.word.toString(),
                                pos: row.abbr ? row.abbr.toString() + "." : "n.",
                                meaning: row.meaning.toString()
                            });
                        }
                        
                        processed++;
                        const progress = Math.floor((processed / jsonData.length) * 100);
                        progressFill.style.width = progress + '%';
                        progressText.textContent = progress + '%';
                    }
                    
                    if (end < jsonData.length) {
                        setTimeout(() => processBatch(end, batchSize), 0);
                    } else {
                        setTimeout(() => {
                            wordPool = newWordPool;
                            remainingWords = [...wordPool];
                            shuffleArray(remainingWords);
                            currentWordIndex = 0;
                            wordsToReview = [];
                            completedWordsCount = 0;
                            
                            totalWordsCountEl.textContent = wordPool.length;
                            saveWords();
                            progressContainer.style.display = 'none';
                            
                            if (remainingWords.length > 0) {
                                showGameUI();
                                loadWord();
                            } else {
                                showEmptyUI();
                                alert("未找到有效的單字 (請確保表格有 word 和 meaning 欄位)");
                            }
                        }, 500);
                    }
                };
                
                processBatch(0, 10);
            };
            
            reader.readAsArrayBuffer(file);
        }

        function setupEventListeners() {
            playBtn.addEventListener('click', () => {
                if (currentWord) playPronounciation(currentWord.word);
            });
            
            hintBtn.addEventListener('click', () => {
                if (currentWord) phonicsEl.classList.toggle('show');
            });
            
            reportBtn.addEventListener('click', () => {
                if (wordPool.length > 0) showReport();
                else alert("目前沒有單字記錄！");
            });
            
            inputBtn.addEventListener('click', () => {
                unlockSpeech(); 
                fileInput.click();
            });
            
            fileInput.addEventListener('change', (e) => {
                if (e.target.files.length > 0) {
                    importWordsFromExcel(e.target.files[0]);
                }
            });
            
            closeBtn.addEventListener('click', () => {
                reportModal.style.display = 'none';
                if (remainingWords.length === 0 && wordPool.length > 0) {
                    remainingWords = [...wordPool];
                    shuffleArray(remainingWords);
                    currentWordIndex = 0;
                    completedWordsCount = 0;
                    loadWord();
                }
            });
            
            reportModal.addEventListener('click', (e) => {
                if (e.target === reportModal) {
                    reportModal.style.display = 'none';
                    if (remainingWords.length === 0 && wordPool.length > 0) {
                        remainingWords = [...wordPool];
                        shuffleArray(remainingWords);
                        currentWordIndex = 0;
                        completedWordsCount = 0;
                        loadWord();
                    }
                }
            });
        }

        initGame();
    </script>
</body>
</html>
